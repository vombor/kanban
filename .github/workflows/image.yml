# Builds the fork and publishes the dev-container image to GHCR:
#   a push to fork/**:      ghcr.io/<owner>/kanban:sha-<short>, :<branch> (e.g. fork-stack) and :latest (LATEST_BRANCH
#                           only; the daily schedule rebuilds it too);
#   a version tag v<X.Y.Z[-pre]> (a release, RELEASE_WORKFLOW.md): :<version> without the v (e.g. :0.1.70-fork.8, the
#                           semver {{version}} form) and :stable, moved to it. A release never touches :latest or :sha-*.
# The producer's dev pushes keep :latest moving; a consumer pod follows :stable (docs/fork/container-lifecycle.md) and
# sets update.imageChannel to match. A release build carries its version (build arg KANBAN_IMAGE_VERSION and the label
# dev.vombor.kanban.release, the same value), so a pod can tell which release it runs; other builds have it empty.
# The container sits next to the npm package @vombor/kanban (GitHub Packages keeps a container and an npm package of
# the same name apart); until 2026-10-12 it was ghcr.io/<owner>/kanban-dev, which is no longer pushed.
# The pod pulls the image; nothing is built from source on the host.
# A daily scheduled run rebuilds LATEST_BRANCH so new npm releases of the agent CLIs (and npm) are picked up.
# Schedules only fire from the repo DEFAULT branch: set the fork's default branch to LATEST_BRANCH.
# The GHCR push uses the repo secret GH_PAT (the user's classic PAT, docs/fork/github-auth.md), not GITHUB_TOKEN.
# Publishing the npm package is publish.yml's, on version tags only.
name: image

on:
  push:
    branches: ["fork/**"]
    tags: ["v*"]
  schedule:
    - cron: "17 6 * * *"   # daily, 06:17 UTC
  workflow_dispatch:

env:
  LATEST_BRANCH: fork/stack   # the branch the pod follows via :latest
  IMAGE: ghcr.io/${{ github.repository_owner }}/kanban

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Require the GH_PAT secret
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_PAT" ]; then
            echo "::error::The repository secret GH_PAT is missing. Add the classic PAT (scopes repo, read:packages, write:packages, workflow) as GH_PAT; see docs/fork/github-auth.md."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && env.LATEST_BRANCH || github.ref }}

      # A release is a fork version tag that matches package.json (publish.yml checks the same): an upstream tag or a
      # mismatch fails here, so :stable never moves to it. Empty for every other build.
      - name: Resolve the release
        id: release
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" != "tag" ] || [ "$EVENT" = "schedule" ]; then
            echo "version=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag '$TAG' must match vX.Y.Z (with optional prerelease suffix, e.g. v0.1.70-fork.8)"
            exit 1
          fi
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if [ "$name" != "@vombor/kanban" ] || [ "$TAG" != "v$version" ]; then
            echo "::error::tag '$TAG' is not a fork release (package.json: $name $version)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Release: $TAG" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Build and test Kanban
        run: |
          npm ci
          npm ci --prefix web-ui
          npm run build
          npm test

      - name: Pack Kanban
        run: |
          # The scoped package packs as vombor-kanban-<version>.tgz; an empty dir makes it the only tarball.
          mkdir -p "$RUNNER_TEMP/pack"
          npm pack --pack-destination "$RUNNER_TEMP/pack"
          mv "$RUNNER_TEMP"/pack/*.tgz deploy/kanban.tgz

      - name: Resolve agent CLI versions
        id: clis
        run: |
          list=""
          for p in npm @anthropic-ai/claude-code @github/copilot @openai/codex cline @factory/cli; do
            list="$list $p@$(npm view "$p" version)"
          done
          echo "list=${list# }" >> "$GITHUB_OUTPUT"
          echo "Agent CLIs:${list}" >> "$GITHUB_STEP_SUMMARY"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GH_PAT }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # latest=false: :latest only ever comes from the raw rule below, never from a release tag.
          flavor: |
            latest=false
          tags: |
            type=sha,enable=${{ steps.release.outputs.version == '' }}
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.event_name == 'schedule' || github.ref == format('refs/heads/{0}', env.LATEST_BRANCH) }}
            type=semver,pattern={{version}},enable=${{ steps.release.outputs.version != '' }}
            type=raw,value=stable,enable=${{ steps.release.outputs.version != '' }}

      - uses: docker/build-push-action@v6
        with:
          context: deploy
          file: deploy/Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            dev.vombor.agent-clis=${{ steps.clis.outputs.list }}
            dev.vombor.kanban.release=${{ steps.release.outputs.version }}
          # The image's build stamp for `kanban restart update`: the same values as the revision/created labels and
          # the release label (src/update/container-image.ts reads the env of the running image and the labels of the
          # registry's tag).
          build-args: |
            AGENT_CLIS=${{ steps.clis.outputs.list }}
            KANBAN_IMAGE_REVISION=${{ github.sha }}
            KANBAN_IMAGE_CREATED=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            KANBAN_IMAGE_VERSION=${{ steps.release.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
