# Builds the fork and publishes the dev-container image to GHCR:
#   ghcr.io/<owner>/kanban-dev:sha-<short>, :<branch> (e.g. fork-stack) and :latest (from LATEST_BRANCH only).
# The pod pulls the image; nothing is built from source on the host.
# A daily scheduled run rebuilds LATEST_BRANCH so new npm releases of the agent CLIs (and npm) are picked up.
# Schedules only fire from the repo DEFAULT branch: set the fork's default branch to LATEST_BRANCH.
# The GHCR push uses the repo secret GH_PAT (the user's classic PAT, docs/fork/github-auth.md), not GITHUB_TOKEN.
# Publishing the npm package is publish.yml's, on version tags only.
name: image

on:
  push:
    branches: ["fork/**"]
  schedule:
    - cron: "17 6 * * *"   # daily, 06:17 UTC
  workflow_dispatch:

env:
  LATEST_BRANCH: fork/stack   # the branch the pod follows via :latest
  IMAGE: ghcr.io/${{ github.repository_owner }}/kanban-dev

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Require the GH_PAT secret
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_PAT" ]; then
            echo "::error::The repository secret GH_PAT is missing. Add the classic PAT (scopes repo, read:packages, write:packages, workflow) as GH_PAT; see docs/fork/github-auth.md."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && env.LATEST_BRANCH || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Build and test Kanban
        run: |
          npm ci
          npm ci --prefix web-ui
          npm run build
          npm test

      - name: Pack Kanban
        run: |
          # The scoped package packs as vombor-kanban-<version>.tgz; an empty dir makes it the only tarball.
          mkdir -p "$RUNNER_TEMP/pack"
          npm pack --pack-destination "$RUNNER_TEMP/pack"
          mv "$RUNNER_TEMP"/pack/*.tgz deploy/kanban.tgz

      - name: Resolve agent CLI versions
        id: clis
        run: |
          list=""
          for p in npm @anthropic-ai/claude-code @github/copilot @openai/codex cline @factory/cli; do
            list="$list $p@$(npm view "$p" version)"
          done
          echo "list=${list# }" >> "$GITHUB_OUTPUT"
          echo "Agent CLIs:${list}" >> "$GITHUB_STEP_SUMMARY"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GH_PAT }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.event_name == 'schedule' || github.ref == format('refs/heads/{0}', env.LATEST_BRANCH) }}

      - uses: docker/build-push-action@v6
        with:
          context: deploy
          file: deploy/Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            dev.vombor.agent-clis=${{ steps.clis.outputs.list }}
          build-args: |
            AGENT_CLIS=${{ steps.clis.outputs.list }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
